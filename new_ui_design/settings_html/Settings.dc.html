<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--ln:rgba(255,255,255,.09);--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);--bl:#0a84ff;--up:#30d158}
*{box-sizing:border-box}
.ph{width:390px;height:844px;background:#000;position:relative;overflow:hidden;color:#fff;font-family:"SF Pro Display","SF Pro Text",-apple-system,"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ph button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
.num{font-family:"Geist Mono","SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center}
.lb{font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--t2);margin:18px 32px 7px}
.grp{margin:0 16px;background:var(--s1);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;border-bottom:1px solid var(--ln);font-size:16px}
.li:last-child{border-bottom:0}
.si{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.si .ic{width:18px;height:18px;stroke:#fff}
.tg{width:51px;height:31px;border-radius:16px;background:var(--s3);position:relative;flex:none}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tg.on{background:var(--up)}.tg.on:after{left:22px}
.v{font-size:15px;color:var(--t2)}
.tb{position:absolute;left:14px;right:14px;bottom:22px;height:66px;border-radius:33px;display:flex;padding:0 8px;align-items:center;background:rgba(44,44,46,.7);backdrop-filter:blur(28px) saturate(1.8);border:1px solid rgba(255,255,255,.09)}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--t2);height:54px;justify-content:center;border-radius:27px}
.tb button.on{color:var(--bl);background:rgba(10,132,255,.14)}
</style>
</helmet>
<div class="ph">
  <div style="height:58px"></div>
  <div style="padding:0 16px;height:48px;display:flex;align-items:center"><div style="font-size:34px;font-weight:700;letter-spacing:-.03em">Settings</div></div>

  <div class="lb" style="margin-top:8px">MARKET DATA</div>
  <div class="grp">
    <div class="li"><div class="si" style="background:#30d158"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 9a13 13 0 0118 0M6 12.5a8.5 8.5 0 0112 0M9.5 16a4 4 0 015 0"></path></svg></div><span style="flex:1">Biquote feed</span><span class="num v" style="color:#43e06a">Live · 24 ms</span></div>
    <div class="li"><div class="si" style="background:#0a84ff"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div><span style="flex:1">Direct IP fallback</span><button class="tg on" aria-label="Direct IP fallback"></button></div>
  </div>

  <div class="lb">BACKGROUND MONITORING</div>
  <div class="grp">
    <div class="li"><div class="si" style="background:#bf5af2"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v9l5 3"></path><circle cx="12" cy="12" r="9"></circle></svg></div><span style="flex:1">Perpetual service</span><span class="v" style="color:#43e06a">Running</span></div>
    <div class="li"><div class="si" style="background:#ff9f0a"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="9" rx="2.5"></rect><path d="M21 11v3"></path></svg></div><span style="flex:1">Battery optimization</span><span class="v">Unrestricted</span><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--t3)"><path d="M9 6l6 6-6 6"></path></svg></div>
    <div class="li"><div class="si" style="background:#64d2ff"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v8M7 7a8 8 0 1010 0"></path></svg></div><span style="flex:1">Start on boot</span><button class="tg on" aria-label="Start on boot"></button></div>
  </div>

  <div class="lb">ALARMS</div>
  <div class="grp">
    <div class="li"><div class="si" style="background:#ff453a"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"></path></svg></div><span style="flex:1">Bypass Do Not Disturb</span><button class="tg on" aria-label="Bypass Do Not Disturb"></button></div>
    <div class="li"><div class="si" style="background:#8e8e93"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 010 6"></path></svg></div><div style="flex:1;display:flex;flex-direction:column;gap:9px;padding:6px 0"><span>Alarm volume</span><div style="height:4px;border-radius:2px;background:var(--s3);position:relative"><div style="width:78%;height:4px;border-radius:2px;background:#fff"></div></div></div></div>
    <div class="li"><div class="si" style="background:#0a84ff"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg></div><span style="flex:1">Sound</span><span class="v">Siren</span><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--t3)"><path d="M9 6l6 6-6 6"></path></svg></div>
  </div>

  <div class="lb">ABOUT</div>
  <div class="grp">
    <div class="li"><span style="flex:1">Version</span><span class="num v">1.0.0 (build 1)</span></div>
  </div>

  <div class="tb">
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4v3M7 17v3M17 8v3M17 18v2"></path><rect x="5" y="7" width="4" height="10" rx="1"></rect><rect x="15" y="11" width="4" height="7" rx="1"></rect></svg>Chart</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg>Alerts</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>AI</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Markets</button>
    <button class="on"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>More</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
