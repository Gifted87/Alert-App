<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Alert</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--ln:rgba(255,255,255,.09);--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);--bl:#0a84ff;--up:#30d158}
*{box-sizing:border-box}
.ph{width:390px;height:844px;background:#000;position:relative;overflow:hidden;color:#fff;font-family:"SF Pro Display","SF Pro Text",-apple-system,"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ph button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
.num{font-family:"Geist Mono","SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center}
.seg{display:flex;background:var(--s1);border-radius:10px;padding:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:13px;font-weight:600;color:var(--t2)}
.seg button.on{background:var(--s3);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tg{width:51px;height:31px;border-radius:16px;background:var(--s3);position:relative;flex:none}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tg.on{background:var(--up)}.tg.on:after{left:22px}
.grp{margin:0 16px;background:var(--s1);border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--ln)}
.li:last-child{border-bottom:0}
.lb{font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--t2);margin:20px 32px 8px}
.cc{flex:1;height:44px;border-radius:12px;background:var(--s1);font-size:14px;font-weight:600;color:var(--t2);display:flex;align-items:center;justify-content:center;border:1.5px solid transparent}
.cc.on{background:rgba(10,132,255,.14);color:#4da3ff;border-color:var(--bl)}
</style>
</helmet>
<div class="ph">
  <div class="row" style="position:absolute;left:0;right:0;top:58px;height:44px;justify-content:space-between;padding:0 16px">
    <button style="font-size:17px;color:#4da3ff">Cancel</button>
    <div style="font-size:17px;font-weight:600">New Alert</div>
    <span style="width:52px"></span>
  </div>

  <div style="position:absolute;left:16px;right:16px;top:112px"><div class="seg"><button class="on">Price</button><button>Pattern</button><button>Indicator</button><button>Chain</button></div></div>

  <div style="position:absolute;left:0;right:0;top:158px">
    <div class="grp">
      <div class="li" style="min-height:60px"><div style="width:32px;height:32px;border-radius:16px;background:rgba(10,132,255,.2);color:#4da3ff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">EU</div><div style="flex:1"><div style="font-size:17px;font-weight:600">EUR/USD</div><div style="font-size:12px;color:var(--t2)">Forex Major</div></div><div style="text-align:right"><div class="num" style="font-size:15px;font-weight:600">1.08548</div><div class="num" style="font-size:12px;color:#43e06a">Live</div></div><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--t3)"><path d="M9 6l6 6-6 6"></path></svg></div>
    </div>

    <div style="margin:16px 16px 0;background:var(--s1);border-radius:24px;padding:18px 18px 16px;text-align:center">
      <div style="font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--t2)">TARGET PRICE</div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <button aria-label="Decrease" style="width:44px;height:44px;border-radius:22px;background:var(--s2);display:flex;align-items:center;justify-content:center"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14"></path></svg></button>
        <div class="num" style="font-size:44px;font-weight:600;letter-spacing:-.05em">1.09250</div>
        <button aria-label="Increase" style="width:44px;height:44px;border-radius:22px;background:var(--s2);display:flex;align-items:center;justify-content:center"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
      <div class="num" style="font-size:13px;color:var(--t2);margin-top:6px">+70.2 pips from current</div>
    </div>

    <div class="row" style="gap:8px;margin:12px 16px 0"><div class="cc on">Crosses Above</div><div class="cc">Crosses Below</div><div class="cc">Hits</div></div>

    <div class="row" style="gap:10px;margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:rgba(10,132,255,.1);color:#7cbcff;font-size:13px;line-height:1.35;align-items:flex-start"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;margin-top:1px"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8v.5"></path></svg><span>Fires only when price moves up through 1.09250 — never instantly if it’s already above.</span></div>

    <div class="lb">OPTIONS</div>
    <div class="grp">
      <div class="li"><div style="flex:1"><div style="font-size:17px">Rearm after cooldown</div></div><button class="tg on" aria-label="Rearm"></button></div>
      <div class="li" style="flex-direction:column;align-items:stretch;gap:12px;padding:12px 16px 16px">
        <div class="row" style="justify-content:space-between"><span style="font-size:17px">Cooldown</span><span class="num" style="font-size:15px;color:var(--t2)">15 min</span></div>
        <div style="height:4px;border-radius:2px;background:var(--s3);position:relative"><div style="width:42%;height:4px;border-radius:2px;background:var(--bl)"></div><div style="position:absolute;left:42%;top:-12px;width:28px;height:28px;margin-left:-14px;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.5)"></div></div>
      </div>
      <div class="li"><span style="flex:1;font-size:17px">Alarm sound</span><span style="font-size:15px;color:var(--t2)">Siren</span><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--t3)"><path d="M9 6l6 6-6 6"></path></svg></div>
    </div>
  </div>

  <div style="position:absolute;left:16px;right:16px;bottom:34px">
    <button style="width:100%;height:54px;border-radius:16px;background:var(--bl);font-size:17px;font-weight:600;box-shadow:0 10px 30px rgba(10,132,255,.4)">Create Alert</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
