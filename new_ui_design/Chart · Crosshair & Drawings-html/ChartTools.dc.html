<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chart Crosshair and Drawings</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--ln:rgba(255,255,255,.09);--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);--bl:#0a84ff;--up:#30d158;--dn:#ff453a;--am:#ff9f0a;--pu:#bf5af2}
*{box-sizing:border-box}
.ph{width:390px;height:844px;background:#000;position:relative;overflow:hidden;color:#fff;font-family:"SF Pro Display","SF Pro Text",-apple-system,"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ph button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
.num{font-family:"Geist Mono","SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center}
.glass{background:rgba(44,44,46,.72);backdrop-filter:blur(28px) saturate(1.8);border:1px solid rgba(255,255,255,.1)}
.tool{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.tool.on{background:var(--bl);color:#fff}
.tb{position:absolute;left:14px;right:14px;bottom:22px;height:66px;border-radius:33px;display:flex;padding:0 8px;align-items:center}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--t2);height:54px;justify-content:center;border-radius:27px}
.tb button.on{color:var(--bl);background:rgba(10,132,255,.14)}
.cd{position:absolute;width:5px}
.cd i{position:absolute;left:50%;top:0;bottom:0;width:1.5px;margin-left:-.75px}
.cd b{position:absolute;left:0;right:0;border-radius:1.5px}
.gl{position:absolute;left:0;width:336px;height:1px;background:rgba(255,255,255,.05)}
.ax{position:absolute;left:342px;font-size:10px;color:var(--t2);transform:translateY(-50%)}
.hd{position:absolute;width:20px;height:20px;border-radius:10px;background:#000;border:2.5px solid #64d2ff;margin:-10px 0 0 -10px}
</style>
</helmet>
<div class="ph">
  <div class="row" style="position:absolute;left:16px;right:16px;top:58px;justify-content:space-between;height:44px">
    <div class="row" style="gap:10px"><span style="font-size:17px;font-weight:600">EUR/USD</span><span class="num" style="font-size:15px;color:#43e06a;font-weight:500">1.08548</span><span style="font-size:12px;color:var(--t2)">1H</span></div>
    <button style="height:34px;padding:0 16px;border-radius:17px;background:var(--bl);font-size:15px;font-weight:600">Done</button>
  </div>

  <div style="position:absolute;left:0;top:112px;width:390px;height:540px">
    <div style="position:absolute;left:12px;top:0;width:336px;height:510px">
      <sc-for list="{{grid}}" as="g" hint-placeholder-count="5"><div class="gl" style="top:{{g.y}}px"></div></sc-for>
      <div style="position:absolute;left:{{rx}}px;top:{{ry}}px;width:{{rw}}px;height:{{rh}}px;background:rgba(191,90,242,.14);border:1.5px dashed rgba(191,90,242,.7);border-radius:4px"></div>
      <sc-for list="{{candles}}" as="c" hint-placeholder-count="48">
        <div class="cd" style="left:{{c.x}}px;top:{{c.wt}}px;height:{{c.wh}}px"><i style="background:{{c.col}}"></i><b style="top:{{c.bt}}px;height:{{c.bh}}px;background:{{c.col}}"></b></div>
      </sc-for>
      <svg width="336" height="510" viewBox="0 0 336 510" style="position:absolute;left:0;top:0" aria-hidden="true">
        <line x1="{{x1}}" y1="{{y1}}" x2="{{x2}}" y2="{{y2}}" stroke="#64d2ff" stroke-width="2" stroke-linecap="round"></line>
        <line x1="{{cx}}" y1="0" x2="{{cx}}" y2="510" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-dasharray="4 4"></line>
        <line x1="0" y1="{{cy}}" x2="336" y2="{{cy}}" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-dasharray="4 4"></line>
      </svg>
      <div class="hd" style="left:{{x1}}px;top:{{y1}}px"></div>
      <div class="hd" style="left:{{x2}}px;top:{{y2}}px"></div>
      <div style="position:absolute;left:{{cx}}px;top:{{cy}}px;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:22px;border:1.5px solid #fff;background:rgba(255,255,255,.08)"></div>
      <div style="position:absolute;left:{{cx}}px;top:{{cy}}px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:3px;background:#fff"></div>

      <div class="glass row" style="position:absolute;left:{{ctxX}}px;top:{{ctxY}}px;height:44px;padding:0 6px;border-radius:22px;gap:2px">
        <button class="tool" aria-label="Attach alert" style="color:#ffb340;width:38px"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg></button>
        <button class="tool" aria-label="Lock" style="width:38px"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg></button>
        <button class="tool" aria-label="Delete" style="color:#ff6961;width:38px"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg></button>
      </div>
    </div>
    <sc-for list="{{grid}}" as="g" hint-placeholder-count="5"><div class="ax num" style="top:{{g.y}}px">{{g.label}}</div></sc-for>
    <div class="num" style="position:absolute;left:343px;top:{{cyTag}}px;width:46px;height:20px;border-radius:4px 0 0 4px;background:#fff;color:#000;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">{{cLabel}}</div>
    <div class="num" style="position:absolute;left:{{cxTag}}px;top:512px;height:20px;padding:0 8px;border-radius:4px;background:#fff;color:#000;font-size:10px;font-weight:700;display:flex;align-items:center">13 Oct · 12:00</div>

    <div class="glass num" style="position:absolute;left:72px;top:6px;border-radius:14px;padding:8px 12px;font-size:11px;line-height:1.55;color:var(--t2)">
      <span style="color:#fff;font-weight:600">13 Oct 12:00</span> &nbsp;<span style="color:#43e06a">▲ 0.08%</span><br>O {{o}} &nbsp;H {{h}}<br>L {{l}} &nbsp;C {{cl}}
    </div>
  </div>

  <!-- Drawing palette -->
  <div class="glass" style="position:absolute;left:14px;top:300px;width:54px;padding:7px;border-radius:27px;display:flex;flex-direction:column;gap:4px;align-items:center">
    <button class="tool" aria-label="Cursor"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4l14 7-6 2-2 6z"></path></svg></button>
    <button class="tool" aria-label="Horizontal line"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h18"></path><circle cx="12" cy="12" r="1.5"></circle></svg></button>
    <button class="tool on" aria-label="Trendline"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19L20 6"></path><circle cx="4" cy="19" r="1.6"></circle><circle cx="20" cy="6" r="1.6"></circle></svg></button>
    <button class="tool" aria-label="Ray"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 17l15-9"></path><circle cx="5" cy="17" r="1.6"></circle><path d="M17 6l3 2-2 3"></path></svg></button>
    <button class="tool" aria-label="Fibonacci"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h16M4 20h16"></path></svg></button>
    <button class="tool" aria-label="Rectangle"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"></rect></svg></button>
    <button class="tool" aria-label="Vertical line"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v18"></path></svg></button>
  </div>

  <!-- Style strip -->
  <div class="glass row" style="position:absolute;left:14px;right:14px;top:672px;height:62px;border-radius:22px;padding:0 14px;justify-content:space-between">
    <div class="row" style="gap:8px">
      <i style="width:24px;height:24px;border-radius:12px;background:#64d2ff;box-shadow:0 0 0 3px #000,0 0 0 5px #64d2ff;display:block"></i>
      <i style="width:24px;height:24px;border-radius:12px;background:#ffd60a;display:block"></i>
      <i style="width:24px;height:24px;border-radius:12px;background:#bf5af2;display:block"></i>
      <i style="width:24px;height:24px;border-radius:12px;background:#ff453a;display:block"></i>
    </div>
    <div class="col" style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-size:12px;color:var(--t2)">Trendline</span><span class="num" style="font-size:13px;font-weight:600;color:#ffb340">Alert armed · {{alertLbl}}</span></div>
  </div>

  <div class="tb glass">
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4v3M7 17v3M17 8v3M17 18v2"></path><rect x="5" y="7" width="4" height="10" rx="1"></rect><rect x="15" y="11" width="4" height="7" rx="1"></rect></svg>Chart</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg>Alerts</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>AI</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Markets</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>More</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 48, W = 336, H = 510, st = W / N;
    let s = 23; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    let p = 1.0815; const cs = [];
    for (let i = 0; i < N; i++) {
      const o = p, c = o + (r() - 0.46) * 0.0008 + (i < 14 ? -0.00006 : i < 36 ? 0.00016 : -0.00004);
      cs.push({ o, h: Math.max(o, c) + r() * 0.0004, l: Math.min(o, c) - r() * 0.0004, c }); p = c;
    }
    const hi = Math.max(...cs.map(k => k.h)), lo = Math.min(...cs.map(k => k.l));
    const pad = (hi - lo) * 0.12, top = hi + pad, bot = lo - pad;
    const y = v => (top - v) / (top - bot) * H;
    const X = i => i * st + st / 2;
    const a = 12, b = 34, ci = 30;
    const x1 = X(a), y1 = y(cs[a].l), x2 = X(b), y2 = y(cs[b].l) + 0;
    const rx = X(19), rw = X(29) - X(19), ry = y(Math.max(...cs.slice(19, 29).map(k => k.h))), rh = y(Math.min(...cs.slice(19, 29).map(k => k.l))) - ry;
    const cx = X(ci), cy = y(cs[ci].c);
    const midY = (y1 + y2) / 2, midX = (x1 + x2) / 2;
    const fmt = v => v.toFixed(5);
    // price at trendline end for the attached alert label
    const priceAt = yy => top - yy / H * (top - bot);
    return {
      candles: cs.map((k, i) => {
        const up = k.c >= k.o;
        return { x: (i * st + (st - 5) / 2).toFixed(1), wt: y(k.h).toFixed(1), wh: (y(k.l) - y(k.h)).toFixed(1),
          bt: (y(Math.max(k.o, k.c)) - y(k.h)).toFixed(1), bh: Math.max(1.5, Math.abs(y(k.o) - y(k.c))).toFixed(1), col: up ? '#30d158' : '#ff453a' };
      }),
      grid: [0, 1, 2, 3, 4].map(k => { const v = bot + (top - bot) * k / 4; return { y: y(v).toFixed(1), label: v.toFixed(4) }; }),
      x1: x1.toFixed(1), y1: y1.toFixed(1), x2: x2.toFixed(1), y2: y2.toFixed(1),
      rx: rx.toFixed(1), ry: ry.toFixed(1), rw: rw.toFixed(1), rh: rh.toFixed(1),
      cx: cx.toFixed(1), cy: cy.toFixed(1), cxTag: (cx + 12 - 42).toFixed(1), cyTag: (cy - 10).toFixed(1), cLabel: cs[ci].c.toFixed(4),
      ctxX: (midX - 62).toFixed(1), ctxY: (midY - 70).toFixed(1),
      o: fmt(cs[ci].o), h: fmt(cs[ci].h), l: fmt(cs[ci].l), cl: fmt(cs[ci].c),
      alertLbl: priceAt(y2).toFixed(5)
    };
  }
}
</script>
</body>
</html>
