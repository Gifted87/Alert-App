<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Symbol Picker</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--ln:rgba(255,255,255,.09);--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);--bl:#0a84ff}
*{box-sizing:border-box}
.ph{width:390px;height:844px;background:#000;position:relative;overflow:hidden;color:#fff;font-family:"SF Pro Display","SF Pro Text",-apple-system,"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ph button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
.num{font-family:"Geist Mono","SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center}
.chip{height:32px;padding:0 14px;border-radius:16px;background:var(--s2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;color:#fff;flex:none}
.chip.on{background:#fff;color:#000}
.rw{display:flex;align-items:center;gap:12px;height:66px;border-bottom:1px solid var(--ln)}
.tile{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:700}
</style>
</helmet>
<div class="ph">
  <div style="position:absolute;left:0;right:0;top:46px;bottom:0;background:#0c0c0e;border-radius:34px 34px 0 0;border-top:1px solid rgba(255,255,255,.1);padding:8px 16px 0">
    <div style="width:36px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 12px"></div>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div style="font-size:28px;font-weight:700;letter-spacing:-.03em">Symbols</div>
      <button style="height:34px;padding:0 16px;border-radius:17px;background:var(--s2);font-size:15px;font-weight:600">Close</button>
    </div>
    <div class="row" style="gap:10px;height:44px;border-radius:12px;background:var(--s1);padding:0 12px;margin-bottom:12px">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="color:var(--t2);width:20px;height:20px"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <span style="font-size:17px;color:var(--t3)">Search 120+ instruments</span>
    </div>
    <div class="row" style="gap:6px;overflow:hidden;margin:0 -16px;padding:0 16px">
      <span class="chip on">Favorites</span><span class="chip">Forex</span><span class="chip">Metals</span><span class="chip">Crypto</span><span class="chip">Indices</span>
    </div>
    <div style="font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--t2);margin:18px 0 2px">FAVORITES · 7</div>
    <sc-for list="{{items}}" as="s" hint-placeholder-count="7">
      <div class="rw">
        <svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;color:#ff9f0a;fill:#ff9f0a;stroke:#ff9f0a"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"></path></svg>
        <div class="tile" style="background:{{s.bg}};color:{{s.fg}}">{{s.ini}}</div>
        <div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:600">{{s.name}}</div><div style="font-size:12px;color:var(--t2)">{{s.cat}}</div></div>
        <svg viewBox="0 0 56 22" width="56" height="22" aria-hidden="true"><path d="{{s.d}}" fill="none" stroke="{{s.col}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div style="text-align:right;width:78px"><div class="num" style="font-size:15px;font-weight:600">{{s.price}}</div><div class="num" style="font-size:12px;color:{{s.col}}">{{s.chg}}</div></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = '#43e06a', R = '#ff6961';
    const spark = (seed, up) => {
      let s = seed; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
      let v = 11; const pts = [];
      for (let i = 0; i < 14; i++) { v += (r() - (up ? 0.42 : 0.58)) * 4; pts.push(v); }
      const mn = Math.min(...pts), mx = Math.max(...pts);
      return pts.map((q, i) => (i ? 'L' : 'M') + (1 + i * 54 / 13).toFixed(1) + ' ' + (20 - (q - mn) / (mx - mn || 1) * 18).toFixed(1)).join(' ');
    };
    const mk = (name, cat, ini, tint, price, chg, up, seed) => ({
      name, cat, ini, price, chg, d: spark(seed, up), col: up ? G : R,
      bg: tint[0], fg: tint[1]
    });
    const bl = ['rgba(10,132,255,.18)', '#4da3ff'], am = ['rgba(255,159,10,.18)', '#ffb340'], pu = ['rgba(191,90,242,.18)', '#d58cf7'], tl = ['rgba(100,210,255,.16)', '#64d2ff'];
    return { items: [
      mk('EUR/USD', 'Forex Major · EURUSD', 'EU', bl, '1.08548', '+0.12%', true, 3),
      mk('GBP/USD', 'Forex Major · GBPUSD', 'GB', bl, '1.30512', '+0.21%', true, 8),
      mk('USD/JPY', 'Forex Major · USDJPY', 'JP', bl, '155.302', '−0.18%', false, 5),
      mk('Gold', 'Precious Metals · XAUUSD', 'XAU', am, '2650.40', '−0.38%', false, 12),
      mk('Bitcoin', 'Crypto · BTCUSD', 'BTC', pu, '67 240', '+1.42%', true, 21),
      mk('S&P 500', 'Index CFD · US500', '500', tl, '5842.3', '+0.31%', true, 17),
      mk('WTI Oil', 'Commodities · USOIL', 'OIL', am, '71.82', '−0.64%', false, 29)
    ] };
  }
}
</script>
</body>
</html>
