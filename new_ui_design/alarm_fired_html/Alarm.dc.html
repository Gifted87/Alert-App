<style>

  <div style="position:absolute;left:0;right:0;top:70px;text-align:center">

    <div style="font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:8px">EUR/USD crossed above</div>
    <div class="num" style="font-size:44px;font-weight:600;letter-spacing:-.05em;margin-top:6px">1.09250</div>
    <div class="num" style="font-size:14px;color:rgba(235,235,245,.6);margin-top:6px">Triggered at 1.09252 · Bid 1.09250 · Ask 1.09262</div>

      <span style="font-size:17px;font-weight:600;margin-left:40px;color:rgba(255,255,255,.85)">Slide to dismiss alarm</span>

    <div style="display:flex;gap:12px">
      <button style="flex:1;height:52px;border-radius:26px;background:rgba(255,255,255,.12);font-size:16px;font-weight:600">Snooze 5 min</button>
