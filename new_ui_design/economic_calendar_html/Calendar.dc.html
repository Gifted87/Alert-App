<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Economic Calendar</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--ln:rgba(255,255,255,.09);--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);--bl:#0a84ff;--up:#30d158;--dn:#ff453a}
*{box-sizing:border-box}
.ph{width:390px;height:844px;background:#000;position:relative;overflow:hidden;color:#fff;font-family:"SF Pro Display","SF Pro Text",-apple-system,"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ph button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
.num{font-family:"Geist Mono","SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center}
.chip{height:30px;padding:0 13px;border-radius:15px;background:var(--s1);font-size:13px;font-weight:600;display:inline-flex;align-items:center;color:var(--t2);flex:none}
.chip.on{background:#fff;color:#000}
.day{width:62px;height:62px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;color:var(--t2);font-size:11px;font-weight:600;letter-spacing:.06em}
.day b{font-size:20px;font-weight:600;color:#fff;letter-spacing:-.02em}
.day.on{background:var(--bl);color:rgba(255,255,255,.85)}
.ev{background:var(--s1);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cb{height:22px;padding:0 8px;border-radius:7px;background:var(--s2);font-size:11px;font-weight:700;letter-spacing:.04em;display:inline-flex;align-items:center}
.imp{display:flex;gap:2px;align-items:flex-end}.imp i{width:4px;border-radius:2px;display:block}
.cl{flex:1;display:flex;flex-direction:column;gap:2px}
.cl span{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--t3)}
.cl b{font-size:15px;font-weight:600}
.tb{position:absolute;left:14px;right:14px;bottom:22px;height:66px;border-radius:33px;display:flex;padding:0 8px;align-items:center;background:rgba(44,44,46,.7);backdrop-filter:blur(28px) saturate(1.8);border:1px solid rgba(255,255,255,.09)}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--t2);height:54px;justify-content:center;border-radius:27px}
.tb button.on{color:var(--bl);background:rgba(10,132,255,.14)}
</style>
</helmet>
<div class="ph">
  <div style="height:58px"></div>
  <div class="row" style="justify-content:space-between;padding:0 16px;height:48px">
    <div style="font-size:34px;font-weight:700;letter-spacing:-.03em">Calendar</div>
    <span class="num" style="font-size:12px;color:var(--t2)">GMT+1</span>
  </div>
  <div class="row" style="gap:6px;padding:8px 16px 0;overflow:hidden"><span class="chip on">All</span><span class="chip">USD</span><span class="chip">EUR</span><span class="chip">GBP</span><span class="chip">JPY</span><span class="chip">AUD</span></div>
  <div class="row" style="gap:8px;padding:12px 16px 0;overflow:hidden">
    <div class="day"><span>MON</span><b>12</b></div><div class="day"><span>TUE</span><b>13</b></div><div class="day on"><span>WED</span><b>14</b></div><div class="day"><span>THU</span><b>15</b></div><div class="day"><span>FRI</span><b>16</b></div>
  </div>

  <div class="col" style="display:flex;flex-direction:column;gap:10px;padding:14px 16px 0">
    <div class="ev" style="background:linear-gradient(135deg,rgba(255,69,58,.18),var(--s1));border:1px solid rgba(255,69,58,.25)">
      <div class="row" style="justify-content:space-between"><div class="row" style="gap:8px"><span class="cb">USD</span><span style="font-size:12px;font-weight:600;color:#ff6961">HIGH IMPACT · IN 1H 12M</span></div><span class="num" style="font-size:13px;color:var(--t2)">13:30</span></div>
      <div style="font-size:19px;font-weight:600;letter-spacing:-.02em">Non-Farm Payrolls</div>
      <div class="row"><div class="cl"><span>FORECAST</span><b class="num">185K</b></div><div class="cl"><span>PREVIOUS</span><b class="num">142K</b></div><button class="row" style="height:36px;padding:0 14px;border-radius:18px;background:rgba(255,159,10,.18);color:#ffb340;font-size:13px;font-weight:600;gap:6px"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg>Alert 5m before</button></div>
    </div>

    <div class="ev">
      <div class="row" style="justify-content:space-between"><div class="row" style="gap:8px"><span class="cb">USD</span><div class="imp"><i style="height:6px;background:#ff453a"></i><i style="height:10px;background:#ff453a"></i><i style="height:14px;background:#ff453a"></i></div></div><span class="num" style="font-size:13px;color:var(--t2)">08:30</span></div>
      <div style="font-size:16px;font-weight:600">Core CPI m/m</div>
      <div class="row"><div class="cl"><span>ACTUAL</span><b class="num" style="color:#43e06a">0.3%</b></div><div class="cl"><span>FORECAST</span><b class="num">0.2%</b></div><div class="cl"><span>PREVIOUS</span><b class="num">0.2%</b></div></div>
    </div>

    <div class="ev">
      <div class="row" style="justify-content:space-between"><div class="row" style="gap:8px"><span class="cb">GBP</span><div class="imp"><i style="height:6px;background:#ff9f0a"></i><i style="height:10px;background:#ff9f0a"></i><i style="height:14px;background:#3a3a3c"></i></div></div><span class="num" style="font-size:13px;color:var(--t2)">07:00</span></div>
      <div style="font-size:16px;font-weight:600">GDP m/m</div>
      <div class="row"><div class="cl"><span>ACTUAL</span><b class="num" style="color:#ff6961">0.0%</b></div><div class="cl"><span>FORECAST</span><b class="num">0.1%</b></div><div class="cl"><span>PREVIOUS</span><b class="num">0.2%</b></div></div>
    </div>

    <div class="ev" style="padding:12px 14px">
      <div class="row" style="justify-content:space-between"><div class="row" style="gap:8px"><span class="cb">EUR</span><div class="imp"><i style="height:6px;background:#ffd60a"></i><i style="height:10px;background:#3a3a3c"></i><i style="height:14px;background:#3a3a3c"></i></div></div><span class="num" style="font-size:13px;color:var(--t2)">10:00</span></div>
      <div style="font-size:16px;font-weight:600">ECB President Speaks</div>
    </div>
  </div>

  <div class="tb">
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4v3M7 17v3M17 8v3M17 18v2"></path><rect x="5" y="7" width="4" height="10" rx="1"></rect><rect x="15" y="11" width="4" height="7" rx="1"></rect></svg>Chart</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg>Alerts</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>AI</button>
    <button class="on"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Markets</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>More</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
