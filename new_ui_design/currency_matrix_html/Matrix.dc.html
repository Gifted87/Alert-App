<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Currency Matrix</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--ln:rgba(255,255,255,.09);--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);--bl:#0a84ff;--up:#30d158;--dn:#ff453a}
*{box-sizing:border-box}
.ph{width:390px;height:844px;background:#000;position:relative;overflow:hidden;color:#fff;font-family:"SF Pro Display","SF Pro Text",-apple-system,"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ph button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
.num{font-family:"Geist Mono","SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center}
.seg{display:flex;background:var(--s1);border-radius:10px;padding:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:13px;font-weight:600;color:var(--t2)}
.seg button.on{background:var(--s3);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.card{background:var(--s1);border-radius:22px;padding:14px}
.mc{width:38px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex:none}
.ml{width:34px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--t2);display:flex;align-items:center;flex:none}
.tb{position:absolute;left:14px;right:14px;bottom:22px;height:66px;border-radius:33px;display:flex;padding:0 8px;align-items:center;background:rgba(44,44,46,.7);backdrop-filter:blur(28px) saturate(1.8);border:1px solid rgba(255,255,255,.09)}
.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--t2);height:54px;justify-content:center;border-radius:27px}
.tb button.on{color:var(--bl);background:rgba(10,132,255,.14)}
</style>
</helmet>
<div class="ph">
  <div style="height:58px"></div>
  <div class="row" style="justify-content:space-between;padding:0 16px;height:48px">
    <div style="font-size:34px;font-weight:700;letter-spacing:-.03em">Matrix</div>
    <span style="font-size:12px;font-weight:600;color:#43e06a;display:flex;align-items:center;gap:6px"><i style="width:6px;height:6px;border-radius:3px;background:#30d158;display:block"></i>28 pairs live</span>
  </div>
  <div style="padding:8px 16px 0"><div class="seg"><button class="on">Today</button><button>Week</button><button>Month</button></div></div>

  <div class="card" style="margin:12px 16px 0;padding:14px 14px 10px">
    <div style="font-size:11px;font-weight:600;letter-spacing:.09em;color:var(--t2);margin-bottom:6px">STRENGTH RANKING</div>
    <div class="row" style="justify-content:space-between;height:88px;align-items:stretch">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
        <div style="width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative">
          <div style="position:absolute;left:0;right:0;top:36px;height:1px;background:var(--ln)"></div>
          <div style="position:absolute;left:8px;right:8px;top:{{b.top}}px;height:{{b.h}}px;border-radius:5px;background:{{b.c}}"></div>
          <div style="position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:10px;font-weight:700;color:var(--t2);letter-spacing:.04em">{{b.cur}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div class="card" style="margin:10px 16px 0;padding:12px 10px">
    <div class="row" style="gap:2px;margin-bottom:4px;padding-left:34px">
      <sc-for list="{{heads}}" as="h" hint-placeholder-count="8"><div class="mc" style="background:none;color:var(--t2);height:18px;font-size:10px;letter-spacing:.04em">{{h}}</div></sc-for>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div class="row" style="gap:2px;margin-bottom:2px">
        <div class="ml">{{r.cur}}</div>
        <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="8"><div class="mc num" style="background:{{c.bg}};color:{{c.fg}}">{{c.t}}</div></sc-for>
      </div>
    </sc-for>
  </div>

  <div class="row" style="margin:10px 16px 0;padding:12px 14px;border-radius:20px;background:rgba(10,132,255,.12);gap:12px">
    <div style="flex:1"><div style="font-size:11px;font-weight:600;letter-spacing:.09em;color:#7cbcff">DIVERGENCE</div><div style="font-size:15px;font-weight:600;margin-top:2px">GBP strongest · JPY weakest</div></div>
    <button style="height:36px;padding:0 14px;border-radius:18px;background:var(--bl);font-size:14px;font-weight:600">GBP/JPY</button>
  </div>

  <div class="tb">
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4v3M7 17v3M17 8v3M17 18v2"></path><rect x="5" y="7" width="4" height="10" rx="1"></rect><rect x="15" y="11" width="4" height="7" rx="1"></rect></svg>Chart</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1112 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg>Alerts</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>AI</button>
    <button class="on"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Markets</button>
    <button><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>More</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = ['GBP', 'NZD', 'EUR', 'AUD', 'CAD', 'USD', 'CHF', 'JPY'];
    const s = { GBP: 0.31, NZD: 0.15, EUR: 0.12, AUD: 0.08, CAD: 0.04, USD: -0.05, CHF: -0.10, JPY: -0.42 };
    const bars = cur.map(c => {
      const v = s[c], h = Math.max(4, Math.abs(v) / 0.42 * 32);
      return { cur: c, h: h.toFixed(1), top: (v >= 0 ? 36 - h : 36).toFixed(1), c: v >= 0 ? '#30d158' : '#ff453a' };
    });
    const rows = cur.map(a => ({
      cur: a,
      cells: cur.map(b => {
        if (a === b) return { t: '–', bg: 'rgba(255,255,255,.04)', fg: 'rgba(235,235,245,.3)' };
        const v = s[a] - s[b], al = Math.min(0.8, 0.14 + Math.abs(v) * 1.3);
        return { t: (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2), bg: v >= 0 ? 'rgba(48,209,88,' + al.toFixed(2) + ')' : 'rgba(255,69,58,' + al.toFixed(2) + ')', fg: '#fff' };
      })
    }));
    return { bars, rows, heads: cur };
  }
}
</script>
</body>
</html>
